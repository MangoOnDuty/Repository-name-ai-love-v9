<!DOCTYPE html>
<html lang="zh">

<head>
<meta charset="UTF-8">
<title>AI恋爱军师 V9.1</title>

<style>

body{
    margin:0;
    font-family: Arial;
    background:#0f172a;
    color:white;
}

/* 顶部标题 */
.header{
    padding:20px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    background:#111827;
}

/* 主体 */
.container{
    max-width:800px;
    margin:auto;
    padding:15px;
}

/* 输入框 */
textarea{
    width:100%;
    height:140px;
    border-radius:12px;
    border:none;
    padding:12px;
    font-size:14px;
    outline:none;
}

/* 按钮 */
button{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    cursor:pointer;
}

/* 聊天气泡 */
.chat-box{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.msg{
    padding:12px;
    border-radius:12px;
    max-width:90%;
    white-space:pre-wrap;
    line-height:1.5;
}

/* 用户 */
.user{
    background:#334155;
    align-self:flex-end;
}

/* AI */
.ai{
    background:#1e293b;
    align-self:flex-start;
}

/* 提示 */
.tip{
    font-size:12px;
    color:#94a3b8;
    margin-top:8px;
}

</style>
</head>

<body>

<div class="header">💘 AI恋爱军师 V9.1</div>

<div class="container">

<textarea id="text" placeholder="把你和她的聊天内容粘贴在这里..."></textarea>

<button onclick="run()">让AI帮我分析 + 给回复</button>

<div class="tip">每日免费5次（测试版）</div>

<div class="chat-box" id="chat"></div>

</div>

<script>

let store = JSON.parse(localStorage.getItem("v91") || "{}");

function today(){
    return new Date().toDateString();
}

function checkLimit(){
    if(store.date !== today()){
        store.date = today();
        store.count = 0;
    }
    if(!store.count) store.count = 0;
}

function addMsg(text, type){
    let div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    document.getElementById("chat").appendChild(div);
}

async function run(){

    checkLimit();

    if(store.count >= 5){
        alert("今日次数已用完（5次/天）");
        return;
    }

    let text = document.getElementById("text").value;

    if(!text){
        alert("请输入聊天内容");
        return;
    }

    addMsg(text, "user");

    addMsg("AI分析中，请稍等...", "ai");

    const res = await fetch("/api/analyze", {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({ text })
    });

    const data = await res.json();

    store.count++;
    localStorage.setItem("v91", JSON.stringify(store));

    addMsg(data.result, "ai");
}

</script>

</body>
</html>
